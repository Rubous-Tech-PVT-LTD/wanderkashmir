<!DOCTYPE html>
<html>
<head>
  <style>
    body { background: #f8fafc; padding: 40px; display: flex; gap: 30px; font-family: sans-serif; }
    .box { background: white; padding: 16px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; gap: 8px; border: 1px solid #e2e8f0; }
    svg { width: 44px; height: 44px; }
  </style>
</head>
<body>
  <!-- A: Centered sharp pin, road trailing right from tip -->
  <div class="box">
    <span>A (Trailing right)</span>
    <svg viewBox="0 0 32 32" fill="none">
      <ellipse cx="16" cy="27" rx="10" ry="2.2" fill="rgba(100, 116, 139, 0.28)" />
      <path d="M16 24.8C18.5 24.8 21 26.2 24.5 25.8" stroke="#1E293B" stroke-width="1.6" stroke-linecap="round" />
      <circle cx="24.5" cy="25.8" r="1.4" fill="#1E293B" />
      <path d="M16 24.8L9.8 11.2A6.4 6.4 0 1 1 22.2 11.2Z" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.6" stroke-linejoin="miter" />
      <circle cx="16" cy="9.8" r="2.2" fill="#1E293B" />
    </svg>
  </div>

  <!-- B: Centered sharp pin, road clearly separated below at y=26.5 -->
  <div class="box">
    <span>B (Road below)</span>
    <svg viewBox="0 0 32 32" fill="none">
      <ellipse cx="16" cy="27" rx="10" ry="2.2" fill="rgba(100, 116, 139, 0.28)" />
      <path d="M7 26.5C10.5 25.2 13.5 25.2 16 26.5C18.5 27.5 21.5 27.5 25 26.5" stroke="#1E293B" stroke-width="1.6" stroke-linecap="round" />
      <circle cx="25" cy="26.5" r="1.3" fill="#1E293B" />
      <path d="M16 23.8L9.8 11A6.4 6.4 0 1 1 22.2 11Z" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.6" stroke-linejoin="miter" />
      <circle cx="16" cy="9.6" r="2.2" fill="#1E293B" />
    </svg>
  </div>

  <!-- C: Centered sharp pin touching target ring/dot (Pure MMT destination) -->
  <div class="box">
    <span>C (Target ground ring)</span>
    <svg viewBox="0 0 32 32" fill="none">
      <ellipse cx="16" cy="26.5" rx="9.5" ry="2.5" fill="rgba(100, 116, 139, 0.28)" />
      <ellipse cx="16" cy="25.5" rx="5.5" ry="1.8" stroke="#1E293B" stroke-width="1.4" fill="#FFFFFF" />
      <path d="M16 25L9.8 11.2A6.4 6.4 0 1 1 22.2 11.2Z" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.6" stroke-linejoin="miter" />
      <circle cx="16" cy="9.8" r="2.2" fill="#1E293B" />
    </svg>
  </div>

  <!-- D: Winding road with white cutout under tip so tip remains 100% sharp -->
  <div class="box">
    <span>D (Winding road + sharp tip)</span>
    <svg viewBox="0 0 32 32" fill="none">
      <ellipse cx="16" cy="27" rx="10" ry="2.2" fill="rgba(100, 116, 139, 0.28)" />
      <!-- Road behind -->
      <path d="M6 26.5C10 25 13 25 16 26.2C19 27.2 22 27.2 26 26" stroke="#1E293B" stroke-width="1.6" stroke-linecap="round" />
      <circle cx="25.5" cy="26" r="1.4" fill="#1E293B" />
      <!-- Sharp pin with apex at 24.5 clearly above the road -->
      <path d="M16 24.5L9.6 11A6.4 6.4 0 1 1 22.4 11Z" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.6" stroke-linejoin="miter" />
      <circle cx="16" cy="9.6" r="2.2" fill="#1E293B" />
    </svg>
  </div>
</body>
</html>
